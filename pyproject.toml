[project]
name = "matrix-check"
version = "0.1.0"
description = "Проверка сотрудников Excel по справочнику"
authors = [
    {name = "antonnagulin",email = "nagulin03@mail.ru"}
]
requires-python = ">=3.11,<3.16"
dependencies = [
    "pandas (>=3.0.0,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[project.optional-dependencies]
dev = ["pytest>=9.0.2,<10.0.0"]
build = ["pyinstaller>=6.0,<7.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.scripts]
matrix-check = "src.main:main"
